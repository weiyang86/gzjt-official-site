<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>内容建设中｜甘孜州建设投资集团有限公司</title>
  <link rel="stylesheet" href="/pages/assets/theme.css" />
  <link rel="stylesheet" href="/pages/assets/pages.css" />
  <link rel="stylesheet" href="/pages/assets/global-ui.css" />
</head>
<body>
  <div class="page-transition"></div>

  <header class="site-header" aria-label="顶部导航">
    <div class="container">
      <div class="header-inner">
        <a class="brand" href="/A版官网首页.html" data-no-transition>
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">
            <b>甘孜州建设投资集团</b>
            <span>GANZI CONSTRUCTION INVESTMENT GROUP</span>
          </span>
        </a>
        <nav class="nav" aria-label="一级导航">
          <a href="/A版官网首页.html" data-no-transition>首页</a>
        </nav>
        <div class="header-actions">
          <a class="btn btn--primary" href="/pages/contact/index.html">在线服务</a>
          <button class="menu-toggle" type="button" aria-label="打开菜单" data-menu-toggle aria-expanded="false"><i></i></button>
        </div>
      </div>
    </div>
  </header>

  <div class="drawer" data-drawer aria-hidden="true">
    <div class="drawer-backdrop" data-drawer-close></div>
    <div class="drawer-panel" role="dialog" aria-label="移动端菜单">
      <div class="drawer-top">
        <b style="letter-spacing:.6px">导航</b>
        <button class="drawer-close" type="button" aria-label="关闭菜单" data-drawer-close>×</button>
      </div>
      <div class="drawer-links" aria-label="移动端导航链接">
        <a href="/A版官网首页.html" data-no-transition>首页</a>
      </div>
    </div>
  </div>

  <div class="breadcrumb" aria-label="面包屑导航">
    <div class="content">
      <div class="crumb-inner" data-breadcrumb></div>
    </div>
  </div>

  <main class="page" aria-label="主要内容" data-placeholder-page>
    <section class="hero">
      <div class="hero-bg">
        <div class="swiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide"><img alt="" src="/配图/雅砻江大桥.jpg" /></div>
          </div>
        </div>
      </div>
      <div class="hero-grid" aria-hidden="true"></div>
      <div class="hero-noise" aria-hidden="true"></div>
      <div class="content hero-inner">
        <div>
          <div class="kicker reveal" data-anim="fadeUp"><i aria-hidden="true"></i><span>INFORMATION</span></div>
          <h1 class="hero-title reveal" data-anim="blurReveal" data-page-title>内容建设中</h1>
          <p class="hero-sub reveal" data-anim="fadeUp" data-page-sub>该栏目正在建设中，将尽快完善内容。</p>
          <div class="hero-cta reveal" data-anim="fadeUp">
            <a class="btn btn--primary" href="/pages/news/index.html">查看最新动态</a>
            <a class="btn" href="/pages/contact/index.html">联系我们</a>
          </div>
        </div>
      </div>
    </section>

    <section class="section" aria-label="内容建设中">
      <div class="content">
        <div class="section-head reveal" data-anim="fadeUp">
          <div>
            <div class="kicker"><i aria-hidden="true"></i><span>COMING SOON</span></div>
            <div class="h2">内容建设中</div>
            <p class="lead">该栏目已纳入网站框架结构，后续将按计划上线具体内容。</p>
          </div>
        </div>
        <div class="card reveal" data-anim="fadeUp">
          <div class="card-pad">
            <div class="pill">提示</div>
            <div class="rich" style="margin-top:12px">
              <p>如需进一步了解相关事项，可通过“在线服务”或“联系我们”入口获取帮助。</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" aria-label="页脚信息">
    <div class="content">
      <div class="footbar">
        <span>© <span id="y"></span> 甘孜州建设投资集团有限公司</span>
        <span><a href="/pages/contact/index.html">在线服务</a></span>
      </div>
    </div>
  </footer>

  <script src="/pages/assets/site-nav.js"></script>
  <script src="/pages/assets/placeholder.js"></script>
  <script src="/pages/assets/app.js"></script>
  <script src="/pages/assets/global-ui.js"></script>
</body>
</html>
