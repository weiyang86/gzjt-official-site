<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>栏目页｜甘孜州建设投资集团有限公司</title>
  <link rel="stylesheet" href="/pages/assets/theme.css" />
  <link rel="stylesheet" href="/pages/assets/pages.css" />
  <link rel="stylesheet" href="/pages/assets/global-ui.css" />
</head>
<body>
  <div class="page-transition"></div>

  <header class="site-header" aria-label="顶部导航">
    <div class="container">
      <div class="header-inner">
        <a class="brand" href="/A版官网首页.html" data-no-transition>
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">
            <b>甘孜州建设投资集团</b>
            <span>GANZI CONSTRUCTION INVESTMENT GROUP</span>
          </span>
        </a>
        <nav class="nav" aria-label="一级导航">
          <a href="/A版官网首页.html" data-no-transition>首页</a>
        </nav>
        <div class="header-actions">
          <a class="btn btn--primary" href="/pages/contact/index.html">在线服务</a>
          <button class="menu-toggle" type="button" aria-label="打开菜单" data-menu-toggle aria-expanded="false"><i></i></button>
        </div>
      </div>
    </div>
  </header>

  <div class="drawer" data-drawer aria-hidden="true">
    <div class="drawer-backdrop" data-drawer-close></div>
    <div class="drawer-panel" role="dialog" aria-label="移动端菜单">
      <div class="drawer-top">
        <b style="letter-spacing:.6px">导航</b>
        <button class="drawer-close" type="button" aria-label="关闭菜单" data-drawer-close>×</button>
      </div>
      <div class="drawer-links" aria-label="移动端导航链接">
        <a href="/A版官网首页.html" data-no-transition>首页</a>
      </div>
    </div>
  </div>

  <div class="breadcrumb" aria-label="面包屑导航">
    <div class="content">
      <div class="crumb-inner" data-breadcrumb></div>
    </div>
  </div>

  <main class="page" aria-label="主要内容" data-list-page>
    <section class="section" aria-label="栏目主体">
      <div class="content">
        <div class="section-head reveal" data-anim="fadeUp">
          <div>
            <div class="kicker"><i aria-hidden="true"></i><span data-page-kicker>SECTION</span></div>
            <div class="h2" data-page-title>栏目页</div>
            <p class="lead" data-page-sub>该栏目采用统一内容模板展示，支持后续按栏目批量扩展。</p>
          </div>
        </div>

        <div class="card reveal" data-anim="fadeUp">
          <div class="card-pad">
            <div class="pill" data-page-tag>栏目说明</div>
            <div class="rich" style="margin-top:12px">
              <p data-page-desc>当前页面已按统一结构生成，包含面包屑导航、栏目标题与内容区域。</p>
            </div>
          </div>
        </div>

        <section class="section" style="padding:32px 0 0" aria-label="栏目入口" data-children-section hidden>
          <div class="section-head reveal" data-anim="fadeUp" style="margin-bottom:24px">
            <div>
              <div class="kicker"><i aria-hidden="true"></i><span>CHANNELS</span></div>
              <div class="h2">栏目入口</div>
              <p class="lead">以下为当前栏目下的结构入口，可继续扩展内容。</p>
            </div>
          </div>
          <div class="grid" data-children-grid></div>
        </section>

        <section class="section" style="padding:32px 0 0" aria-label="同级栏目" data-siblings-section hidden>
          <div class="section-head reveal" data-anim="fadeUp" style="margin-bottom:24px">
            <div>
              <div class="kicker"><i aria-hidden="true"></i><span>RELATED</span></div>
              <div class="h2">同级栏目</div>
              <p class="lead">当前栏目所在层级的其他栏目入口。</p>
            </div>
          </div>
          <div class="tabs" data-siblings-tabs></div>
        </section>
      </div>
    </section>
  </main>

  <footer class="footer" aria-label="页脚信息">
    <div class="content">
      <div class="footbar">
        <span>© <span id="y"></span> 甘孜州建设投资集团有限公司</span>
        <span><a href="/pages/contact/index.html">在线服务</a></span>
      </div>
    </div>
  </footer>

  <script src="/pages/assets/site-nav.js"></script>
  <script src="/pages/assets/list-page.js"></script>
  <script src="/pages/assets/app.js"></script>
  <script src="/pages/assets/global-ui.js"></script>
</body>
</html>
