<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>编辑新闻 - 甘孜建设投资集团官网内容管理后台</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@wangeditor/editor@latest/dist/css/style.css">
</head>
<body class="admin-app-page">
  <div class="admin-layout">
    <aside class="admin-sidebar" aria-label="后台菜单">
      <div class="sidebar-brand">
        <span class="brand-mark">甘</span>
        <div><strong>内容管理后台</strong><small>新闻维护</small></div>
      </div>
      <nav class="admin-nav">
        <a class="admin-nav-link" href="/admin/dashboard.html">工作台</a>
        <a class="admin-nav-link" href="/admin/articles.html">新闻管理</a>
        <a class="admin-nav-link" href="/admin/categories.html">新闻分类</a>
        <a class="admin-nav-link" href="/admin/notice-articles.html">公示公告管理</a>
        <a class="admin-nav-link" href="/admin/notice-categories.html">公示公告分类</a>
        <a class="admin-nav-link" href="/admin/notice-edit.html">新增公示公告</a>
        <a class="admin-nav-link" href="/admin/content.html">页面内容管理</a>
        <a class="admin-nav-link is-active" href="/admin/article-edit.html">新增新闻</a>
        <button id="logout-button" class="admin-nav-link nav-button" type="button">退出登录</button>
      </nav>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div><p class="eyebrow">Article Editor</p><h1 id="page-title">新增新闻</h1></div>
        <div id="topbar-user" class="topbar-user">正在验证登录态…</div>
      </header>

      <main class="dashboard-content">
        <form id="article-form" class="editor-card">
          <div class="form-actions top-actions">
            <a class="secondary-button" href="/admin/articles.html">返回列表</a>
            <button id="save-draft" class="secondary-button" type="button">保存草稿</button>
            <button id="publish-article" class="primary-link-button" type="button">发布</button>
          </div>

          <div id="form-message" class="inline-message" hidden></div>

          <div class="editor-grid">
            <label class="span-2">标题 <span class="required">*</span>
              <input id="title" name="title" type="text" maxlength="255" required>
            </label>
            <label class="span-2">副标题
              <input id="subtitle" name="subtitle" type="text" maxlength="255">
            </label>
            <label class="span-2">摘要
              <textarea id="summary" name="summary" rows="3" maxlength="500"></textarea>
            </label>
            <label>栏目 <span class="required">*</span>
              <select id="main-channel" name="main_channel" required>
                <option value="">请选择栏目</option>
              </select>
            </label>
            <label>状态
              <select id="status" name="status">
                <option value="draft">草稿</option>
                <option value="published">已发布</option>
                <option value="archived">已归档</option>
              </select>
            </label>
            <label>来源
              <input id="source" name="source" type="text" maxlength="128">
            </label>
            <label>作者
              <input id="author" name="author" type="text" maxlength="128">
            </label>
            <label>发布时间
              <input id="publish-at" name="publish_at" type="datetime-local">
            </label>

            <div class="cover-field span-2">
              <label for="cover-file">封面图（JPG / PNG / WEBP，50MB以内）</label>
              <div class="cover-upload-row">
                <input id="cover-file" name="cover_file" type="file" accept="image/jpeg,image/png,image/webp">
                <button id="upload-cover" class="secondary-button" type="button">上传封面</button>
                <input id="cover-id" name="cover" type="hidden">
              </div>
              <p class="field-help">上传成功后会写入文章 cover 字段，文件保存在 Directus File Library。</p>
              <div id="cover-preview-wrap" class="cover-preview-wrap" hidden>
                <img id="cover-preview" class="cover-preview" alt="新闻封面预览">
                <button id="clear-cover" class="text-button" type="button">移除封面</button>
              </div>
            </div>
            <div class="span-2">
              <label for="wang-editor">正文 <span class="required">*</span></label>
              <div id="wang-toolbar" class="wang-toolbar"></div>
              <div id="wang-editor" class="wang-editor" aria-label="正文富文本编辑器"></div>
              <textarea id="content" name="content" class="content-editor" rows="16" required hidden></textarea>
            </div>
          </div>

          <div class="form-actions">
            <a class="secondary-button" href="/admin/articles.html">返回列表</a>
            <button id="save-draft-bottom" class="secondary-button" type="button">保存草稿</button>
            <button id="publish-article-bottom" class="primary-link-button" type="button">发布</button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="/admin/js/admin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@wangeditor/editor@latest/dist/index.min.js"></script>
  <script src="/admin/js/article-edit.js"></script>
</body>
</html>
